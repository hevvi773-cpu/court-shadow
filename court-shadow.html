<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宫廷暗影 · 卡牌版 v0.5</title>
<style>
  :root{--bg:#1c1430;--panel:#2a2150;--card:#fff;-ink:#2b2b2b;--gold:#e7b84b;--demon:#e0556b;--angel:#5aa9e0;--muted:#b9b2d6;}
  *{box-sizing:border-box;}
  body{font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#3a2a66,#1c1430);color:#f3eefc;max-width:820px;margin:0 auto;padding:14px;}
  h1{text-align:center;margin:.2em 0;font-size:24px;letter-spacing:3px;color:var(--gold);}
  .sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:8px;}
  .hide{display:none !important;}
  .topbar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(231,184,75,.3);border-radius:14px;padding:10px 16px;margin:10px 0;}
  .coin{font-size:18px;font-weight:800;color:var(--gold);}
  .round{font-size:14px;color:#fff;}
  .phase{text-align:center;font-size:15px;color:var(--gold);font-weight:700;margin:6px 0;}
  .panel{background:var(--panel);border-radius:16px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.35);margin:12px 0;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .row-label{font-size:13px;color:var(--muted);margin:10px 0 6px;}
  .cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
  .card{width:92px;height:128px;perspective:800px;cursor:pointer;}
  .card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;}
  .face.back{background:linear-gradient(150deg,#5b2a86,#2c5aa0);color:#f0e6ff;border:2px solid var(--gold);font-size:30px;}
  .face.front{transform:rotateY(180deg);background:linear-gradient(160deg,#fffdf7,#f3e9d2);color:#2b2b2b;border:2px solid var(--gold);}
  .face.front .rn{font-size:16px;font-weight:800;}
  .face.front .w{font-size:13px;color:#a9802a;font-weight:700;margin-top:4px;}
  .face.front .tg{font-size:11px;color:#fff;border-radius:6px;padding:1px 6px;margin-top:6px;}
  .tg.d{background:var(--demon);} .tg.a{background:var(--angel);}
  .card.demon .face.front{border-color:var(--demon);box-shadow:0 0 0 3px rgba(224,85,107,.5);}
  .card.sel .face.front{box-shadow:0 0 0 3px var(--demon);}
  .card.guess .face.front{box-shadow:0 0 0 3px var(--gold);}
  .btn{font-size:15px;padding:10px 16px;border:2px solid rgba(231,184,75,.5);border-radius:10px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;transition:.15s;}
  .btn:hover{border-color:var(--gold);}
  .btn.primary{background:var(--gold);color:#2b2b2b;border:none;font-weight:800;}
  .btn.primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{border-color:var(--demon);color:var(--demon);}
  .mask{position:fixed;inset:0;background:rgba(10,8,20,.95);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px;z-index:9;animation:fade .2s ease;}
  .mask h2{font-size:24px;color:var(--gold);margin:0;}
  .hist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .hr{background:rgba(255,255,255,.06);border:1px solid rgba(231,184,75,.25);border-radius:10px;padding:6px 10px;font-size:11px;line-height:1.5;}
  .hr b{color:var(--gold);}
  .small{font-size:12px;color:var(--muted);}
  .result-line{font-size:14px;line-height:1.8;}
  .win{font-size:18px;color:#7CFC9B;font-weight:800;text-align:center;margin-top:10px;}
</style>
</head>
<body>
  <h1>👑 宫廷暗影</h1>
  <div class="sub">宫廷工资推理 · 卡牌版 v0.5</div>
  <div class="topbar" id="topbar"></div>
  <div class="phase" id="phase">准备开始</div>

  <div class="panel hide" id="setup">
    <div class="small" style="text-align:center;line-height:1.7">
      每人各有一套五张角色牌（国师/国王/王后/王子/公主）。每局选 1 张当恶魔（工资=0），天使随机且工资×2；结算后天使/普通人工资翻倍，恶魔冻结。<br>
      顶部是金币，底部是前几轮的天使/恶魔。猜恶魔时直接点对手的牌翻面。<br>
      ⚠️ 最后一局（第 5 局）：王子、公主（未成年人）不可当恶魔。
    </div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn primary" onclick="setMode(false)">👥 双人对战</button>
      <button class="btn" onclick="setMode(true)">🤖 单人 vs AI</button>
    </div>
  </div>

  <div class="panel hide" id="board">
    <div class="row-label" id="myLabel"></div>
    <div class="cards" id="myCards"></div>
    <div class="row-label" id="oppLabel"></div>
    <div class="cards" id="oppCards"></div>
    <div style="text-align:center;margin-top:12px">
      <button class="btn primary" id="mainBtn" onclick="mainAction()">提交</button>
    </div>
  </div>

  <div class="panel hide" id="result">
    <div id="resultBody"></div>
    <div style="text-align:center;margin-top:10px">
      <button class="btn primary" id="nextBtn" onclick="nextRound()">下一局</button>
      <button class="btn ghost" onclick="restart()">重新开始</button>
    </div>
  </div>

  <div class="panel">
    <div class="row-label">📜 前几轮 · 天使 / 恶魔</div>
    <div class="hist" id="history"><span class="small">（暂无）</span></div>
  </div>

<script>
const ROLES=['国师','国王','王后','王子','公主'];
const BASE={ '国师':3, '国王':4, '王后':3, '王子':1, '公主':1 };
const MAX_ROUNDS=5;
const MINOR_ROLES=['王子','公主'];
let MODE='pvp', S=null, ACT=null, OPP=null, PHASE='pick', picked=null, guessed=null;

function freshWages(){return Object.assign({},BASE);}
function initState(){
  S={ round:1, ACT:'A',
    A:{wages:freshWages(),gold:0,demon:null,angel:null,payout:0,angelEarn:0,guess:null},
    B:{wages:freshWages(),gold:0,demon:null,angel:null,payout:0,angelEarn:0,guess:null},
    history:[] };
  picked=null; guessed=null;
}
function show(id){document.getElementById(id).classList.remove('hide');}
function hide(id){document.getElementById(id).classList.add('hide');}
function isLastRound(){return S.round===MAX_ROUNDS;}
function setPhase(t){document.getElementById('phase').textContent='当前阶段：'+t;}

function renderTop(){
  document.getElementById('topbar').innerHTML=
    `<div>🔵 A <span class="coin">${S.A.gold}</span></div>
     <div class="round">第 ${S.round} / ${MAX_ROUNDS} 局</div>
     <div>🔴 B <span class="coin">${S.B.gold}</span></div>`;
}
function makeCard(role,opts){
  // opts: {wage, dem, ang, flip, click}
  const card=document.createElement('div');card.className='card'+(opts.flip?' flipped':'');
  if(opts.dem) card.classList.add('demon');
  if(opts.sel) card.classList.add('sel');
  if(opts.guess) card.classList.add('guess');
  const tag = opts.dem? '<div class="tg d">恶魔</div>' : (opts.ang? '<div class="tg a">天使</div>' : '');
  card.innerHTML=`<div class="card-inner">
      <div class="face back">👑</div>
      <div class="face front"><div class="rn">${role}</div><div class="w">工资 ${opts.wage}</div>${tag}</div>
    </div>`;
  if(opts.click) card.onclick=opts.click;
  return card;
}
function updateGuessVisual(container){
  [...container.children].forEach((c,i)=>{ const isG=(ROLES[i]===guessed); c.classList.toggle('flipped',isG); c.classList.toggle('guess',isG); });
}
function buildBoard(){
  const me=S[ACT], op=S[OPP];
  const myCards=document.getElementById('myCards');myCards.innerHTML='';
  const oppCards=document.getElementById('oppCards');oppCards.innerHTML='';
  ROLES.forEach(r=>{
    if(PHASE==='pick'){
      const disabled = isLastRound()&&MINOR_ROLES.includes(r);
      myCards.appendChild(makeCard(r,{wage:me.wages[r],dem:me.demon===r,flip:true,click:disabled?null:()=>{
        if(S[ACT].demon===r) S[ACT].demon=null; else S[ACT].demon=r;
        buildBoard();
      }}));
      oppCards.appendChild(makeCard(r,{wage:op.wages[r],dem:false,flip:false,click:null}));
    } else if(PHASE==='guess'){
      myCards.appendChild(makeCard(r,{wage:me.wages[r],dem:me.demon===r,ang:me.angel===r,flip:true,click:null}));
      oppCards.appendChild(makeCard(r,{wage:op.wages[r],dem:false,flip:false,click:()=>{
        guessed = (guessed===r)? null : r;
        updateGuessVisual(oppCards);
        document.getElementById('mainBtn').disabled=(guessed==null);
      }}));
    } else { // result
      myCards.appendChild(makeCard(r,{wage:me.wages[r],dem:me.demon===r,ang:me.angel===r,flip:true,click:null}));
      oppCards.appendChild(makeCard(r,{wage:op.wages[r],dem:op.demon===r,ang:op.angel===r,flip:true,click:null}));
    }
  });
  document.getElementById('myLabel').textContent = (ACT==='A'?'🔵 玩家 A':'🔴 玩家 B')+' 的牌（点击选恶魔）';
  document.getElementById('oppLabel').textContent = (OPP==='A'?'🔵 玩家 A':'🔴 玩家 B')+' 的牌（猜恶魔：点一张翻面）';
  const btn=document.getElementById('mainBtn');
  if(PHASE==='pick'){ btn.textContent='确认恶魔，下一步'; btn.disabled=false; }
  else { btn.textContent='确认猜测，下一步'; btn.disabled=(guessed==null); }
}
function startRound(){
  PHASE='pick'; ACT='A'; OPP='B'; picked=null; guessed=null;
  ['A','B'].forEach(k=>{S[k].demon=null;S[k].angel=null;S[k].payout=0;S[k].angelEarn=0;S[k].guess=null;});
  hide('setup');hide('result');renderTop();buildBoard();
  setPhase((ACT==='A'?'玩家A':'玩家B')+' 选恶魔');
  show('board');
}
function setMode(ai){ MODE=ai?'ai':'pvp'; startRound(); }
function mainAction(){
  if(PHASE==='pick'){
    if(isLastRound() && S[ACT].demon && MINOR_ROLES.includes(S[ACT].demon)){ alert('最后一局王子/公主不能当恶魔'); S[ACT].demon=null; buildBoard(); return; }
    if(MODE==='ai'){ aiPickB(); assignAngels(); PHASE='guess'; ACT='A'; OPP='B'; guessed=null; buildBoard(); setPhase('你 猜对手恶魔'); }
    else if(ACT==='A'){ ACT='B'; OPP='A'; guessed=null; buildBoard(); setPhase('玩家B 选恶魔'); }
    else { assignAngels(); PHASE='guess'; ACT='A'; OPP='B'; guessed=null; buildBoard(); setPhase('你 猜对手恶魔'); }
  } else if(PHASE==='guess'){
    if(guessed==null){ alert('请先点一张对手的牌来猜'); return; }
    S[ACT].guess=guessed;
    if(MODE==='ai'){ S.B.guess=ROLES[Math.floor(Math.random()*5)]; resolve(); }
    else if(ACT==='A'){ ACT='B'; OPP='A'; guessed=null; buildBoard(); setPhase('玩家B 猜恶魔'); }
    else { resolve(); }
  }
}
function aiPickB(){
  const cand=ROLES.filter(r=>!(isLastRound()&&MINOR_ROLES.includes(r)));
  S.B.demon=cand[Math.floor(Math.random()*cand.length)];
}
function assignAngels(){
  ['A','B'].forEach(k=>{
    const cand=ROLES.filter(r=>S[k].demon!==r);
    S[k].angel=cand[Math.floor(Math.random()*cand.length)];
  });
}
function resolve(){
  PHASE='result';
  const A=S.A,B=S.B; let lines=[];
  ['A','B'].forEach(k=>{
    const p=S[k];
    p.payout=payout(p);
    p.angelEarn = p.angel ? p.wages[p.angel]*2 : 0;
    p.gold+=p.payout;
    lines.push(`【${k}】恶魔=${p.demon||'无'} 天使=${p.angel} 本局=${p.payout}（累计 ${p.gold}）`);
  });
  function guess(g,t){
    if(!S[t].demon){ lines.push(`↪ ${g} 猜 ${t} 的恶魔，但对方本局无恶魔，无奖励无惩罚。`); return; }
    if(S[g].guess===S[t].demon){ const rw=Math.floor(S[t].angelEarn/2); S[t].gold-=rw; S[g].gold+=rw;
      lines.push(`🎯 ${g} 抓到 ${t} 的恶魔（${S[t].demon}），拿走其天使本局工资的一半：${rw}。`); }
    else lines.push(`❌ ${g} 猜错（实际恶魔=${S[t].demon}），无惩罚。`);
  }
  guess('A','B'); guess('B','A');
  ['A','B'].forEach(k=>{ const p=S[k]; ROLES.forEach(r=>{ if(p.demon!==r) p.wages[r]*=2; }); });
  S.history.push({round:S.round, A:{demon:S.A.demon,angel:S.A.angel}, B:{demon:S.B.demon,angel:S.B.angel}});
  renderHistory();
  buildBoard();
  document.getElementById('resultBody').innerHTML=lines.join('<br>')+`<br><br><b>当前总资产：</b>A=${A.gold}　B=${B.gold}`;
  const w=checkEnd(); if(w) document.getElementById('resultBody').innerHTML+='<div class="win">🏆 '+w+'</div>';
  hide('board'); show('result'); renderTop();
}
function payout(p){ let s=0; for(const r of ROLES){ if(p.demon===r) continue; s+=(p.angel===r)?p.wages[r]*2:p.wages[r]; } return s; }
function renderHistory(){
  const h=document.getElementById('history');
  if(!S.history.length){ h.innerHTML='<span class="small">（暂无）</span>'; return; }
  h.innerHTML=S.history.map(r=>`<div class="hr"><b>第${r.round}局</b><br>A 恶魔:${r.A.demon||'无'}/天使:${r.A.angel}<br>B 恶魔:${r.B.demon||'无'}/天使:${r.B.angel}</div>`).join('');
}
function checkEnd(){ if(S.round>=MAX_ROUNDS) return `已达 ${MAX_ROUNDS} 局，资产多者（${S.A.gold>=S.B.gold?'A':'B'}）获胜！`; return null; }
function nextRound(){ S.round++; startRound(); }
function restart(){ initState(); renderTop(); renderHistory(); ['board','result'].forEach(hide); show('setup'); setPhase('准备开始'); }
initState(); renderTop(); renderHistory(); show('setup');
</script>
</body>
</html>
